[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deli-anura-cdr-etl"
version = "0.1.0"
description = "Incremental Anura CDR import (GCAPI ExportCdrs CSV) into Azure SQL A_Llamada"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "requests",
    "pandas",
    "sqlalchemy",
    "pyodbc",
    # Voz (cli/atribuir_voz): transcripcion + embeddings. torch es pesado.
    "faster-whisper",
    "speechbrain",
    "soundfile",
    "av",
    "scipy",
    "torch",
    "torchaudio",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["etl*", "config*", "cli*"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
