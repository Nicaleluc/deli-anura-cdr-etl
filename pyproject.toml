[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deli-anura-cdr-etl"
version = "0.1.0"
description = "Incremental Anura CDR import (GCAPI ExportCdrs CSV) into Azure SQL A_Llamada"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "requests",
    "pandas",
    "sqlalchemy",
    "pyodbc",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["etl*", "config*", "cli*"]
